name: Update ADP Data to Firestore

on:
  schedule:
    # Note: Cron hours max out at 0-23 in Unix cron syntax.
    # Use '0 0 */2 * *' for every 2 days.
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions:
  contents: read

jobs:
  update-adp-data:
    name: 📊 Sync Player Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'scripts/package.json'
          
      - name: Install dependencies
        working-directory: ./scripts
        run: |
          npm install
          npx playwright install --with-deps chromium
        
      - name: Run Firestore uploader
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npm run upload
        
      - name: Report success
        if: success()
        run: |
          echo "✅ ADP data successfully updated in Firestore"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M UTC")"
          
      - name: Report failure
        if: failure()
        run: |
          echo "❌ Failed to update ADP data in Firestore"
          echo "Check logs above for details"
          exit 1
